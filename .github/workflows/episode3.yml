name: Episode 3 pack
on:
  push:
    branches: [main]
    paths:
      - 'episodes/03-o-retrato-que-faltava/**'
      - 'scripts/build_episode3.py'
      - 'scripts/smoke_episode3.py'
      - '.github/workflows/episode3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unchanged reader and new pack
        run: bash scripts/build.sh && python3 scripts/build_episode3.py
      - uses: actions/upload-artifact@v4
        with:
          name: Raining-Episode-3
          path: dist/Raining-Episodio-03-O-retrato-que-faltava.zip
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Read all episode 3 cards on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/smoke_episode3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Raining-Episode-3-Screenshots
          path: screenshots/
